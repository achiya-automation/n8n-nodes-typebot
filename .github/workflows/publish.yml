name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # npm Trusted Publishing (OIDC) requires a recent npm; no NPM_TOKEN needed.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Auth comes from npm Trusted Publishing (GitHub Actions OIDC); provenance is required for n8n verification.
      - run: npm publish --provenance --access public
